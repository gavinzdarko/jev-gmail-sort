<!doctype html>
<html><head><meta charset="utf-8"><title>Inbox (12) - you@example.com - Gmail</title>
<link rel="stylesheet" href="/extension/content.css">
<style>
  body { margin: 0; font: 14px Roboto, Arial, sans-serif; background: #f6f8fc; }
  .top { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font: 22px "Google Sans", Arial; color: #444746; }
  .top a { width: 32px; height: 32px; border-radius: 50%; background: #6c47ff; }
  [role=main] { margin: 0 16px 0 256px; background: #fff; border-radius: 16px; overflow: hidden; }
  div[gh=mtb] { height: 48px; display: flex; align-items: center; padding: 0 12px; }
  div[gh=mtb] .ic { width: 40px; height: 40px; display: grid; place-items: center; color: #444746; }
  table.F { width: 100%; border-collapse: collapse; table-layout: fixed; }
  tr.zA { height: 40px; border-bottom: 1px solid #f1f3f4; background: #f2f6fc; cursor: pointer; }
  tr.zA.zE { background: #fff; font-weight: 700; }
  tr.zA.x7 { background: #c2dbff; }
  tr.zA td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  td.oZ-x3 { width: 28px; } td.apU { width: 28px; } td.yX { width: 200px; } td.xW { width: 80px; text-align: right; font-size: 12px; }
  [role=checkbox] { width: 14px; height: 14px; border: 2px solid #5f6368; border-radius: 2px; }
  [role=checkbox][aria-checked=true] { background: #0b57d0; border-color: #0b57d0; }
  .xT { display: flex; align-items: baseline; gap: 4px; overflow: hidden; } .y6 { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; } .y2 { overflow: hidden; text-overflow: ellipsis; }
  .y2 { color: #5e5e5e; font-weight: 400; }
</style></head>
<body>
<div class="top">Gmail (mock: real extension files, real Jev)<a aria-label="Google Account: Test Owner (you@example.com)"></a></div>
<div role="main">
  <div gh="mtb"><span class="ic">☐</span><span class="ic">↻</span><span class="ic">⋮</span></div>
  <table class="F"><tbody id="tb"></tbody></table>
</div>
<script type="module">
  // Shim just enough of chrome.* to run the real background.js and content.js in one page. Jev calls
  // go through this server's /api/jev proxy so the key never reaches the page.
  const realFetch = window.fetch.bind(window);
  window.fetch = (u, o) => realFetch(String(u).startsWith("https://api.typesafe.ai/") ? "/api/jev" : u, o);
  const ev = () => { const fns = []; return { fns, addListener: (f) => fns.push(f) }; };
  const onConnect = ev(), onMessage = ev();
  const end = () => ({ onMessage: ev(), onDisconnect: ev(), other: null, dead: false,
    postMessage(m) { const o = this.other; if (!this.dead) setTimeout(() => o.onMessage.fns.forEach((f) => f(JSON.parse(JSON.stringify(m)))), 0); },
    disconnect() { this.dead = this.other.dead = true; this.other.onDisconnect.fns.forEach((f) => f()); } });
  window.chrome = {
    action: { onClicked: ev() },
    storage: { local: { get: async () => ({ key: "via-proxy" }), set: async () => {} }, session: { get: async () => ({}), set: async () => {} } },
    runtime: {
      onConnect, onMessage, openOptionsPage: () => alert("(would open settings)"),
      sendMessage: (m) => new Promise((reply) => { let async = false; onMessage.fns.forEach((f) => (async = f(m, {}, reply) === true || async)); if (!async) reply(); }),
      connect: ({ name }) => { const a = end(), b = end(); a.other = b; b.other = a; a.name = b.name = name; onConnect.fns.forEach((f) => f(b)); return a; },
    },
  };
  await import("/extension/background.js");

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const title = (ms) => new Date(ms).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  const d = await (await fetch("/api/recent?hours=24")).json();
  document.getElementById("tb").innerHTML = d.threads.filter((t) => t.category === "PRIMARY" || t.category === "UPDATES").map((t) => `
    <tr class="zA ${t.unread ? "zE" : "yO"}">
      <td class="oZ-x3"><div role="checkbox" aria-checked="false"></div></td>
      <td class="apU"><span aria-label="${t.starred ? "Starred" : "Not starred"}">${t.starred ? "★" : "☆"}</span></td>
      <td class="yX"><div class="yW"><span email="${esc(t.from.email)}" name="${esc(t.from.name)}">${esc(t.from.name || t.from.email)}</span>${t.count > 1 ? ` <span class="bx0">${t.count}</span>` : ""}</div></td>
      <td class="xY a4W"><div class="xS"><div class="xT"><div class="y6"><span class="bog"><span data-thread-id="#thread-f:${BigInt("0x" + t.id)}" data-legacy-thread-id="${t.id}">${esc(t.subject)}</span></span></div><span class="y2"> - ${esc(t.snippet)}</span></div></div></td>
      <td class="xW"><span title="${title(t.date)}">${new Date(t.date).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}</span></td>
    </tr>`).join("");
  // Gmail's checkboxes toggle on click; mimic that so "Select the rest" is visible.
  document.getElementById("tb").addEventListener("click", (e) => {
    const cb = e.target.closest("[role=checkbox]");
    if (!cb) return;
    const on = cb.getAttribute("aria-checked") !== "true";
    cb.setAttribute("aria-checked", on);
    cb.closest("tr").classList.toggle("x7", on);
  });
  const s = document.createElement("script");
  s.src = "/extension/content.js";
  document.body.appendChild(s);
</script>
</body></html>
